<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0A84F0" />
  <title>HonTomo – Offline</title>
  <style>
    :root { --bg: #ffffff; --text: #2f3349; --muted: #6b7085; --primary: #0a84f0; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #25293c; --text: #e7e9f3; --muted: #a9adc4; }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center; padding: 24px;
      background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      text-align: center;
    }
    main { max-width: 420px; }
    img { display: block; width: 180px; max-width: 60vw; height: auto; margin: 0 auto 28px; }
    h1 { margin: 0 0 10px; font-size: 1.5rem; }
    p { margin: 0 0 24px; line-height: 1.55; color: var(--muted); }
    button {
      appearance: none; border: 0; border-radius: 8px; padding: 12px 28px;
      background: var(--primary); color: #fff; font-size: 1rem; font-weight: 600; cursor: pointer;
    }
    button:active { transform: translateY(1px); }
  </style>
</head>
<body>
  <main>
    <picture>
      <source srcset="/logo-dark.png" media="(prefers-color-scheme: dark)" />
      <img src="/logo.png" alt="HonTomo" />
    </picture>
    <h1>You&rsquo;re offline</h1>
    <p>HonTomo can&rsquo;t reach the server right now. Check your internet connection and try again. Pages you&rsquo;ve already opened may still be available.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
  <script>
    // Reload automatically as soon as the connection comes back
    window.addEventListener('online', function () { location.reload() })
  </script>
</body>
</html>
